<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="scores">
                <div class="score-board">
                    <h3>HOME</h3>
                    <div id="home-score-card" class="score-box">
                        <p id="home-score" class="score">0</p>
                    </div>
                    <div class="button-container">
                        <button class="inc-button" onclick="incOneHome()">+1</button>
                        <button class="inc-button" onclick="incTwoHome()">+2</button>
                        <button class="inc-button" onclick="incThreeHome()">+3</button>
                    </div>
                </div>
                
                <div class="score-board">
                    <h3>GUEST</h3>
                    <div id="guest-score-card" class="score-box">
                        <p id="guest-score" class="score">0</p>
                    </div>
                    <div class="button-container">
                        <button class="inc-button" onclick="incOneGuest()">+1</button>
                        <button class="inc-button" onclick="incTwoGuest()">+2</button>
                        <button class="inc-button" onclick="incThreeGuest()">+3</button>
                    </div>
                </div>
            </div>
            <button id="new-game" onclick="newGame()">Start a new game</button>
            
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
